<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>PRECIO ORO - NEXUM ASSOCIATION</title>

  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Precio Oro" />
  <link rel="icon" href="logo.png" />
  <link rel="apple-touch-icon" href="logo.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --gold: #D4AF37;
      --gold-bright: #FFD700;
      --gold-1: #BF953F;
      --gold-2: #FCF6BA;
      --gold-3: #B38728;
      --gold-4: #FBF5B7;
      --gold-5: #AA771C;
      --bg: #050505;
      --bg-card: #0d0d0d;
      --bg-input: #171717;
      --line: rgba(212, 175, 55, 0.28);
      --line-soft: rgba(212, 175, 55, 0.14);
      --text: #E0E0E0;
      --muted: #9a9a9a;
      --green: #4ade80;
      --red: #f87171;
      --gold-gradient: linear-gradient(135deg, #BF953F 0%, #FCF6BA 25%, #B38728 50%, #FBF5B7 75%, #AA771C 100%);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(212, 175, 55, 0.10), transparent 60%),
        radial-gradient(800px 500px at 100% 110%, rgba(191, 149, 63, 0.08), transparent 55%),
        var(--bg);
      background-attachment: fixed;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      padding: clamp(16px, 4vw, 40px);
      -webkit-tap-highlight-color: transparent;
      overflow-y: auto;
    }

    .card {
      width: 100%;
      max-width: 460px;
      margin: auto;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.02), transparent 40%),
        var(--bg-card);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: clamp(22px, 5vw, 34px);
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.5),
        0 24px 60px rgba(0, 0, 0, 0.65),
        0 0 60px rgba(212, 175, 55, 0.06);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(212, 175, 55, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(212, 175, 55, 0.035) 1px, transparent 1px);
      background-size: 28px 28px;
      mask-image: radial-gradient(circle at 50% 0%, black, transparent 75%);
      -webkit-mask-image: radial-gradient(circle at 50% 0%, black, transparent 75%);
      pointer-events: none;
    }

    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 6px;
      margin-bottom: 20px;
      position: relative;
    }

    .logo {
      width: clamp(150px, 55%, 220px);
      height: auto;
      display: block;
      margin-bottom: 2px;
      filter: drop-shadow(0 6px 18px rgba(212, 175, 55, 0.15));
    }

    .title {
      font-family: 'Orbitron', sans-serif;
      font-weight: 800;
      font-size: clamp(1.35rem, 6vw, 1.8rem);
      letter-spacing: 1px;
      line-height: 1.1;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      font-size: 0.68rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 500;
    }

    .field { margin-bottom: 16px; position: relative; }

    .field label {
      display: block;
      font-size: 0.72rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 7px;
      font-weight: 600;
    }

    .input-wrap { position: relative; display: flex; align-items: center; }

    .input-wrap .prefix,
    .input-wrap .suffix {
      position: absolute;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 500;
      pointer-events: none;
    }
    .input-wrap .prefix { left: 15px; }
    .input-wrap .suffix { right: 15px; }

    input[type="text"] {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--line-soft);
      border-radius: 12px;
      padding: 14px 16px;
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
      outline: none;
    }
    .has-prefix input { padding-left: 34px; }
    .has-suffix input { padding-right: 40px; }

    input::placeholder { color: #555; font-weight: 400; }

    input[type="text"]:focus {
      border-color: var(--gold);
      background: #1c1c1c;
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15), 0 0 18px rgba(212, 175, 55, 0.12);
    }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--line), transparent);
      margin: 22px 0 20px;
    }

    .result-block {
      background: linear-gradient(180deg, rgba(212, 175, 55, 0.07), rgba(212, 175, 55, 0.02));
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px 20px;
      text-align: center;
    }

    .res-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .res-item + .res-item {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px dashed var(--line-soft);
    }

    .res-label {
      font-size: 0.7rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 600;
    }

    .res-num {
      font-family: 'Orbitron', sans-serif;
      font-weight: 800;
      line-height: 1.1;
      word-break: break-word;
      color: #fff;
    }
    .res-num .cur {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.8rem;
      vertical-align: middle;
      color: var(--muted);
      -webkit-text-fill-color: var(--muted);
      margin-right: 4px;
      font-weight: 500;
    }

    .res-compra .res-num { font-size: clamp(1.3rem, 6vw, 1.7rem); }

    .res-venta .res-num {
      font-size: clamp(1.7rem, 8vw, 2.3rem);
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 14px;
      font-size: 0.8rem;
    }
    .meta-row .k { color: var(--muted); letter-spacing: 0.5px; }
    .meta-row .v { font-weight: 600; color: var(--text); }

    .profit {
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-radius: 12px;
      background: var(--bg-input);
      border: 1px solid var(--line-soft);
      font-size: 0.85rem;
    }
    .profit .k { color: var(--muted); letter-spacing: 1px; text-transform: uppercase; font-size: 0.72rem; }
    .profit .v { font-weight: 700; font-size: 1.05rem; }
    .profit .v.pos { color: var(--green); }
    .profit .v.neg { color: var(--red); }
    .profit .v.zero { color: var(--muted); }

    .foot {
      text-align: center;
      margin-top: 20px;
      font-size: 0.66rem;
      letter-spacing: 1px;
      color: #666;
    }
    .foot b { color: var(--gold); font-weight: 600; }

    @media (min-width: 720px) {
      .card { max-width: 500px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="header">
      <img class="logo" src="logo.png" alt="Nexum Association" onerror="this.style.display='none'" />
      <h1 class="title">PRECIO ORO</h1>
      <div class="subtitle">Nexum Association</div>
    </div>

    <div class="field has-suffix">
      <label for="gramos">Cantidad de gramos</label>
      <div class="input-wrap">
        <input id="gramos" type="text" inputmode="decimal" autocomplete="off"
               placeholder="0" data-nav data-money />
        <span class="suffix">g</span>
      </div>
    </div>

    <div class="field has-suffix">
      <label for="pcompra">Porcentaje de compra</label>
      <div class="input-wrap">
        <input id="pcompra" type="text" inputmode="decimal" autocomplete="off"
               placeholder="0" data-nav />
        <span class="suffix">%</span>
      </div>
    </div>

    <div class="field has-prefix">
      <label for="onza">Precio onza (USD)</label>
      <div class="input-wrap">
        <span class="prefix">$</span>
        <input id="onza" type="text" inputmode="decimal" autocomplete="off"
               placeholder="0" data-nav data-money />
      </div>
    </div>

    <div class="field has-prefix">
      <label for="dolar">Precio dólar (COP)</label>
      <div class="input-wrap">
        <span class="prefix">$</span>
        <input id="dolar" type="text" inputmode="decimal" autocomplete="off"
               placeholder="0" data-nav data-money />
      </div>
    </div>

    <div class="field has-suffix">
      <label for="pventa">Porcentaje de venta</label>
      <div class="input-wrap">
        <input id="pventa" type="text" inputmode="decimal" autocomplete="off"
               value="100" data-nav />
        <span class="suffix">%</span>
      </div>
    </div>

    <div class="divider"></div>

    <div class="result-block">
      <div class="res-item res-compra">
        <span class="res-label">Total compra · se gasta</span>
        <span class="res-num"><span class="cur">COP</span><span id="totalCompra">0.00</span></span>
      </div>
      <div class="res-item res-venta">
        <span class="res-label">Total venta · ingresa</span>
        <span class="res-num"><span class="cur">COP</span><span id="totalVenta">0.00</span></span>
      </div>

      <div class="meta-row">
        <span class="k">Precio internacional / gramo (100%)</span>
        <span class="v" id="gramoInt">0.00</span>
      </div>
    </div>

    <div class="profit">
      <span class="k">Ganancia (Venta − Compra)</span>
      <span class="v zero" id="ganancia">0.00</span>
    </div>

    <div class="foot">Oro puro · onza troy = <b>31.1035 g</b></div>
  </main>

  <script>
    const OUNCE_GRAMS = 31.1035;

    const el = {
      gramos: document.getElementById('gramos'),
      pcompra: document.getElementById('pcompra'),
      onza: document.getElementById('onza'),
      dolar: document.getElementById('dolar'),
      pventa: document.getElementById('pventa'),
      totalCompra: document.getElementById('totalCompra'),
      totalVenta: document.getElementById('totalVenta'),
      gramoInt: document.getElementById('gramoInt'),
      ganancia: document.getElementById('ganancia'),
    };

    // Convierte el texto a número: quita las comas (miles) y usa el punto como decimal.
    function num(v) {
      if (v === null || v === undefined) return NaN;
      const cleaned = String(v).replace(/,/g, '').replace(/\s/g, '').trim();
      if (cleaned === '' || cleaned === '.') return NaN;
      const n = parseFloat(cleaned);
      return isFinite(n) ? n : NaN;
    }

    // Formato de salida: miles con coma, decimales con punto (ej. 440,952.89).
    function fmt(n) {
      if (!isFinite(n)) return '0.00';
      return (Math.round(n * 100) / 100).toLocaleString('en-US', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2,
      });
    }

    // Formatea lo que se escribe en un campo: agrega comas de miles en vivo,
    // conserva el punto decimal y limita a 2 decimales.
    function formatMoney(raw) {
      let v = raw.replace(/[^\d.]/g, '');
      const firstDot = v.indexOf('.');
      if (firstDot !== -1) {
        v = v.slice(0, firstDot + 1) + v.slice(firstDot + 1).replace(/\./g, '');
      }
      let intPart = v;
      let decPart = null;
      if (v.indexOf('.') !== -1) {
        const parts = v.split('.');
        intPart = parts[0];
        decPart = parts[1].slice(0, 2);
      }
      intPart = intPart.replace(/^0+(?=\d)/, '');
      const grouped = intPart === ''
        ? (decPart !== null ? '0' : '')
        : intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
      if (decPart !== null) return grouped + '.' + decPart;
      return grouped;
    }

    function calcular() {
      const gramos = num(el.gramos.value);
      const pctCompra = num(el.pcompra.value);
      const onza = num(el.onza.value);
      const dolar = num(el.dolar.value);
      let pctVenta = num(el.pventa.value);
      if (!isFinite(pctVenta)) pctVenta = 100;

      // Precio internacional por gramo (al 100%)
      const gramoInt = (isFinite(onza) && isFinite(dolar))
        ? (onza / OUNCE_GRAMS) * dolar
        : 0;

      const g = isFinite(gramos) ? gramos : 0;
      const cCompra = isFinite(pctCompra) ? pctCompra : 0;

      const totalCompra = gramoInt * (cCompra / 100) * g;
      const totalVenta = gramoInt * (pctVenta / 100) * g;

      el.gramoInt.textContent = fmt(gramoInt);
      el.totalCompra.textContent = fmt(totalCompra);
      el.totalVenta.textContent = fmt(totalVenta);

      // Ganancia = Total venta − Total compra
      const gan = el.ganancia;
      if (totalCompra > 0 || totalVenta > 0) {
        const diff = totalVenta - totalCompra;
        gan.textContent = (diff > 0 ? '+' : '') + fmt(diff);
        gan.classList.remove('pos', 'neg', 'zero');
        gan.classList.add(diff > 0.0001 ? 'pos' : (diff < -0.0001 ? 'neg' : 'zero'));
      } else {
        gan.textContent = '0.00';
        gan.classList.remove('pos', 'neg');
        gan.classList.add('zero');
      }
    }

    // Enter pasa al siguiente campo
    const navInputs = Array.from(document.querySelectorAll('[data-nav]'));
    navInputs.forEach((input, i) => {
      input.addEventListener('input', () => {
        if (input.hasAttribute('data-money')) {
          input.value = formatMoney(input.value);
        }
        calcular();
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          const next = navInputs[i + 1];
          if (next) {
            next.focus();
            next.select();
          } else {
            input.blur();
          }
        }
      });
      // Al enfocar, selecciona todo para reemplazar rápido
      input.addEventListener('focus', () => input.select());
    });

    calcular();
  </script>
</body>
</html>
